# Ejecutables portables (sin instalador) al subir un tag vX.Y.Z:
#   mickhub-linux-x64.tar.gz   -> descomprimir y abrir MickHub/mickhub
#   mickhub-windows-x64.zip    -> descomprimir y abrir MickHub\mickhub.exe
# Los nombres no llevan versión para que releases/latest/download/... no se rompa.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.6'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: app
        run: |
          flutter pub get
          flutter test
          flutter build linux --release
          mkdir -p dist && cp -r build/linux/x64/release/bundle dist/MickHub
          tar -C dist -czf mickhub-linux-x64.tar.gz MickHub
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: app/mickhub-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: app
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release dist/MickHub
          Compress-Archive -Path dist/MickHub -DestinationPath mickhub-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/mickhub-windows-x64.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum mickhub-linux-x64.tar.gz mickhub-windows-x64.zip > SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "MickHub $GITHUB_REF_NAME"
          --generate-notes mickhub-linux-x64.tar.gz mickhub-windows-x64.zip SHA256SUMS.txt
